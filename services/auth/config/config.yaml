# Auth Service Configuration
# Sensitive values (passwords, secrets) are overridden by environment variables
# Viper maps env vars: DATABASE_PASSWORD -> database.password

app:
  frontend_url: "http://localhost:3000"

server:
  name: auth-service
  port: 8081
  grpc_port: 9091
  mode: debug

logger:
  level: debug
  filename: ""
  max_size: 10
  max_backups: 5
  max_age: 30
  compress: true

database:
  host: postgres
  port: 5432
  user: admin
  password: ""        # overridden by DATABASE_PASSWORD env
  dbname: auth_db
  sslmode: disable
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  host: redis
  port: 6379
  password: ""        # overridden by REDIS_PASSWORD env
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

smtp:
  host: mailhog
  port: 1025
  username: ""
  password: ""
  security: "none"
  timeout: 10s
  from_name: "AstraCode"
  from: "noreply@localhost"

jwt:
  access_secret: ""   # overridden by JWT_ACCESS_SECRET env
  refresh_secret: ""  # overridden by JWT_REFRESH_SECRET env
  access_ttl: 15m
  refresh_ttl: 168h

# Redis-backed public-auth controls. Mail endpoints keep a generic response
# when limited so account state and quota state cannot be enumerated.
auth_abuse:
  # Failed-login counters only. The broad IP threshold is intentionally high:
  # one address can represent a university, office, or CGNAT population.
  login_ip_identifier_limit: 5
  login_identifier_risk_limit: 5
  login_identifier_risk_delay: 250ms
  login_broad_ip_limit: 200
  login_window: 15m
  register_ip_hourly_limit: 5
  register_ip_daily_limit: 20
  register_email_daily_limit: 3
  mail_ip_hourly_limit: 10
  mail_ip_daily_limit: 40
  resend_account_hourly_limit: 5
  resend_account_daily_limit: 12
  forgot_account_hourly_limit: 3
  forgot_account_daily_limit: 10
  email_cooldown: 60s
  token_ip_limit: 30
  token_window: 5m
  refresh_ip_limit: 60
  refresh_window: 1m

minio:
  endpoint: "minio:9000"
  access_key: ""      # overridden by MINIO_ACCESS_KEY env
  secret_key: ""      # overridden by MINIO_SECRET_KEY env
  use_ssl: false
  bucket: "avatars"
  public_url: "http://localhost:9000"
