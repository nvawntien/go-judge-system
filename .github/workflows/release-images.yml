name: Release container images

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - validate-tag
      - verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: website
            context: ./website
            dockerfile: ./website/Dockerfile
          - image: auth-service
            context: .
            dockerfile: ./services/auth/Dockerfile
          - image: problem-service
            context: .
            dockerfile: ./services/problem/Dockerfile
          - image: submission-service
            context: .
            dockerfile: ./services/submission/Dockerfile
          - image: judge-worker
            context: .
            dockerfile: ./workers/judge/Dockerfile
          - image: sandbox
            context: .
            dockerfile: ./build/sandbox/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AstraCode ${{ matrix.image }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish immutable release tags
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify:
    name: Verify release commit
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
