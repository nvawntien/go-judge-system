name: CI

on:
  workflow_call:
    inputs:
      git_ref:
        description: Full commit SHA to validate when called by release automation
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go checks (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg
          - services/auth
          - services/problem
          - services/submission
          - workers/judge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Race test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Validate development topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.env.example
          REDIS_ENV_FILE: ./environment/redis.env.example
          SERVICE_ENV_FILE: ./environment/service.env.example
          GATEWAY_JWK_FILE: ./gateway/symmetric.json
        run: docker compose config --quiet

      - name: Validate production topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.prod.env.example
          REDIS_ENV_FILE: ./environment/redis.prod.env.example
          SERVICE_ENV_FILE: ./environment/service.prod.env.example
          GATEWAY_JWK_FILE: ./gateway/symmetric.json
          ASTRACODE_IMAGE_ROOT: ghcr.io/example/astracode
          ASTRACODE_IMAGE_TAG: v0.0.0-ci
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: website
            context: ./website
            dockerfile: ./website/Dockerfile
          - image: auth-service
            context: .
            dockerfile: ./services/auth/Dockerfile
          - image: problem-service
            context: .
            dockerfile: ./services/problem/Dockerfile
          - image: submission-service
            context: .
            dockerfile: ./services/submission/Dockerfile
          - image: judge-worker
            context: .
            dockerfile: ./workers/judge/Dockerfile
          - image: sandbox
            context: .
            dockerfile: ./build/sandbox/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/astracode-${{ matrix.image }}:ci
          build-args: |
            VERSION=ci
            BUILD_TIME=${{ github.event.repository.updated_at }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
