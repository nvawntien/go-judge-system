name: Release container images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character commit SHA to publish as an immutable staging image tag
        required: true
        type: string

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_time: ${{ steps.commit.outputs.time }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Validate staging commit input
        if: github.event_name == 'workflow_dispatch'
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          if [[ ! "$GIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_ref must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}
          fetch-depth: 1

      - name: Record immutable image metadata
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          commit_time="$(git show -s --format=%cI HEAD)"
          version="sha-$sha"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${{ github.ref_name }}"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'time=%s\n' "$commit_time" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  validate-tag:
    name: Validate release input
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Require a semantic version tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - validate-tag
      - verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: website
            context: ./website
            dockerfile: ./website/Dockerfile
          - image: auth-service
            context: .
            dockerfile: ./services/auth/Dockerfile
          - image: problem-service
            context: .
            dockerfile: ./services/problem/Dockerfile
          - image: submission-service
            context: .
            dockerfile: ./services/submission/Dockerfile
          - image: judge-worker
            context: .
            dockerfile: ./workers/judge/Dockerfile
          - image: sandbox
            context: .
            dockerfile: ./build/sandbox/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ needs.prepare.outputs.commit_sha }}
          labels: |
            org.opencontainers.image.title=AstraCode ${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and publish immutable release tags
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_TIME=${{ needs.prepare.outputs.commit_time }}
            COMMIT_SHA=${{ needs.prepare.outputs.commit_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify:
    name: Verify release commit
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      git_ref: ${{ needs.prepare.outputs.commit_sha }}
    permissions:
      contents: read
