name: CI

on:
  workflow_call:
    inputs:
      git_ref:
        description: Full commit SHA to validate when called by release automation
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go checks (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg
          - services/auth
          - services/problem
          - services/submission
          - workers/judge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Race test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Validate development topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.env.example
          REDIS_ENV_FILE: ./environment/redis.env.example
          SERVICE_ENV_FILE: ./environment/service.env.example
          GATEWAY_JWK_FILE: ./gateway/symmetric.json
        run: docker compose config --quiet

      - name: Validate App Node production topology
        env:
          POSTGRES_ENV_FILE: ./environment/postgres.prod.env.example
          REDIS_ENV_FILE: ./environment/redis.prod.env.example
          SERVICE_ENV_FILE: ./environment/service.prod.env.example
          GATEWAY_JWK_FILE: ./gateway/symmetric.json
          ASTRACODE_IMAGE_ROOT: ghcr.io/example/astracode
          ASTRACODE_IMAGE_TAG: v0.0.0-ci
        run: |
          docker compose \
            --project-name go-judge-system \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f environment/app-node.override.ci.yml \
            config --quiet

          docker compose \
            --project-name go-judge-system \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f environment/app-node.override.ci.yml \
            config --format json >/tmp/app-node-compose.json

          jq -e '
            .name == "go-judge-system" and
            (.services | has("go-judge") | not) and
            (.services | has("judge-worker") | not) and
            (.services.kafka.environment.KAFKA_HEAP_OPTS == "-Xms512m -Xmx512m") and
            (.services.kafka.deploy.resources.limits.memory == "1073741824") and
            (.services.kafka.deploy.resources.limits.cpus == 1) and
            (.services.kafka.healthcheck.test == ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("kafka-topics.sh")) | not) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("kafka-broker-api-versions.sh")) | not) and
            ((.services.kafka.healthcheck.test | join(" ") | contains("java")) | not) and
            (.services.kafka.ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9094" and .target == 9094)) and
            (.services["problem-service"].ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9092" and .target == 9092)) and
            (.services.minio.ports | any(.[]; .host_ip == "192.0.2.10" and .published == "9000" and .target == 9000))
          ' /tmp/app-node-compose.json >/dev/null

  deployment-scripts:
    name: Deployment script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Validate deployment and Kafka initialization scripts
        run: |
          bash -n scripts/deploy-app-node.sh
          bash -n scripts/deploy-judge-node.sh
          bash -n scripts/deploy-production.sh
          bash -n infra/kafka/kafka-init.sh

          grep -Fqx 'readonly KAFKA_READY_MAX_ATTEMPTS=30' infra/kafka/kafka-init.sh
          grep -Fqx 'readonly KAFKA_READY_RETRY_SECONDS=2' infra/kafka/kafka-init.sh
          grep -Fq 'for ((attempt = 1; attempt <= KAFKA_READY_MAX_ATTEMPTS; attempt++)); do' infra/kafka/kafka-init.sh
          grep -Fq '"$KAFKA_TOPICS_COMMAND" --bootstrap-server "$KAFKA_BOOTSTRAP_SERVER" --list' infra/kafka/kafka-init.sh
          grep -Fq 'Kafka did not become protocol-ready' infra/kafka/kafka-init.sh
          grep -Fqx 'wait_for_kafka_protocol || exit 1' infra/kafka/kafka-init.sh

          activation="$(sed -n '/^activate() {/,/^}/p' scripts/deploy-app-node.sh)"
          required_activation_guards=(
            '  compose config --quiet || return 1'
            '  compose pull "${APP_RELEASE_SERVICES[@]}" || return 1'
            '  compose up -d --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" kafka || return 1'
            '  compose up --no-deps --force-recreate --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" --exit-code-from kafka-init kafka-init || return 1'
            '  compose up -d --pull never --timeout "${COMPOSE_STOP_TIMEOUT:-30}" "${APP_SERVICES[@]}" || return 1'
            '  compose ps || return 1'
            '  smoke_test || return 1'
            '  wait_for_services || return 1'
            '  configure_avatar_bucket || return 1'
          )
          for guard in "${required_activation_guards[@]}"; do
            grep -Fqx "$guard" <<<"$activation"
          done

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          compose_calls=()
          compose() {
            compose_calls+=("$*")
            return 0
          }
          smoke_test() { return 0; }
          wait_for_services() { return 0; }
          configure_avatar_bucket() { return 0; }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          activate
          expected_calls=(
            'config --quiet'
            'pull website'
            'up -d --pull never --timeout 30 kafka'
            'up --no-deps --force-recreate --pull never --timeout 30 --exit-code-from kafka-init kafka-init'
            'up -d --pull never --timeout 30 website'
            'ps'
          )
          [[ "${compose_calls[*]}" == "${expected_calls[*]}" ]]
          EOF
          } | bash

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          init_invoked=0
          remaining_app_started=0
          compose() {
            if [[ "$*" == 'up --no-deps --force-recreate --pull never --timeout 30 --exit-code-from kafka-init kafka-init' ]]; then
              init_invoked=1
              return 1
            fi
            if [[ "$*" == 'up -d --pull never --timeout 30 website' ]]; then
              remaining_app_started=1
            fi
            return 0
          }
          smoke_test() { return 0; }
          wait_for_services() { return 0; }
          configure_avatar_bucket() { return 0; }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          if activate; then
            echo 'failed kafka-init was accepted by App activation' >&2
            exit 1
          fi
          [[ "$init_invoked" -eq 1 ]]
          [[ "$remaining_app_started" -eq 0 ]]
          EOF
          } | bash

          {
            cat <<'EOF'
          set -Eeuo pipefail
          APP_RELEASE_SERVICES=(website)
          APP_SERVICES=(website)
          compose() { return 0; }
          smoke_test() { return 0; }
          wait_for_services() { return 1; }
          configure_avatar_bucket() {
            echo 'post-deployment configuration must not run after a failed health gate' >&2
            return 0
          }
          EOF
            printf '%s\n' "$activation"
            cat <<'EOF'
          if activate; then
            echo 'failed health gate was masked by a later successful command' >&2
            exit 1
          fi
          EOF
          } | bash

          rendered="$(
            ASTRACODE_JUDGE_DEPLOY_DRY_RUN=1 \
            ASTRACODE_JUDGE_COMPOSE=./environment/judge-node.compose.ci.yml \
            ASTRACODE_JUDGE_CONFIG=./workers/judge/config/config.yaml \
            ASTRACODE_JUDGE_STATE_DIR=/tmp/astracode-judge-state \
            ./scripts/deploy-judge-node.sh v0.0.0-ci
          )"
          grep -Fqx '    image: ghcr.io/nvawntien/go-judge-system/sandbox:v0.0.0-ci' <<<"$rendered"
          grep -Fqx '    image: ghcr.io/nvawntien/go-judge-system/judge-worker:v0.0.0-ci' <<<"$rendered"

  judge-benchmark:
    name: Judge benchmark harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache: false

      - name: Test benchmark harness and collector syntax
        working-directory: tools/benchmark/judge
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          bash -n scripts/collect-container-stats.sh
          bash -n scripts/collect-kafka-lag.sh

  images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: website
            context: ./website
            dockerfile: ./website/Dockerfile
          - image: auth-service
            context: .
            dockerfile: ./services/auth/Dockerfile
          - image: problem-service
            context: .
            dockerfile: ./services/problem/Dockerfile
          - image: submission-service
            context: .
            dockerfile: ./services/submission/Dockerfile
          - image: judge-worker
            context: .
            dockerfile: ./workers/judge/Dockerfile
          - image: sandbox
            context: .
            dockerfile: ./build/sandbox/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/astracode-${{ matrix.image }}:ci
          build-args: |
            VERSION=ci
            BUILD_TIME=${{ github.event.repository.updated_at }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
